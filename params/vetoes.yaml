# Veto thresholds. SUBSTRATE.md section 10, as amended by decisions/0003,
# 0026 and 0038 (turnover is disclosed, never vetoed: nine vetoes). Owner-only.
# Agents may not change a threshold to make a run pass (SUBSTRATE section 2).
params_version: "0.11.2"

cash:
  max_weight: 0.20
risk_calibration:
  # decisions/0030. The realised tracking error is no longer a gate: how much
  # active risk a book ran is a characteristic, disclosed on every run. What
  # gates is whether the book ran the risk it was SIZED for -- the bias
  # statistic of decisions/0027 section 2, std(r_t / sigma_ex_ante(t-1)), read
  # per calendar year and taken at the worst one. The full-sample reading has no
  # power: it is 0.87-1.05 on Bloomberg base cells whose worst year is 1.39-2.21.
  #
  # The ceiling is the p99 of that statistic under a CORRECTLY specified model,
  # from scripts/bias_map.py at the measured excess kurtosis of z (2.37). Not
  # the p95 (1.49): decisions/0026's argument against the drawdown cap applies
  # to any gate that fails one honest run in twenty by construction. Fat tails
  # set the level -- the same quantile is 1.33 at kurtosis 0 -- so re-derive
  # this, do not nudge it, if the panel's tails change.
  max_worst_annual_bias: 1.72
  # A standard deviation of eight numbers is not evidence about a risk model.
  min_observations_per_year: 40
positions:
  max_nonzero: 30
coverage:
  min_universe_fraction: 0.80    # signal available for >= 80% of the estimation universe
  min_date_fraction: 0.90        # on >= 90% of dates
lookahead:
  # decisions/0055: both halves of SUBSTRATE section 10's row. No observation
  # used before its knowledge_date, and no estimated parameter (today, a
  # loading of the exposure matrix) fitted on data later than the date it is
  # used. A run that does not say what its parameters were fitted on fails.
  strict: true
frequency:
  strict: true                   # no series contributes a return before its true daily start
seed_stability:
  max_ir_range: 0.15
multiple_testing:
  # decisions/0043 (owner, 2026-10-01, OWNER-QUEUE L16(a)): the generalized
  # stepdown of Romano and Wolf (2007), stats.multiple_testing.romano_wolf_gfwer.
  # It holds P(g or more false passes in a search) <= fwer_alpha -- with g = 2,
  # a single false pass is tolerated (17-21% of null cycles); two are not.
  # Statistics standardised against their pooled null (decisions/0041).
  procedure: romano_wolf_gfwer
  fwer_alpha: 0.05
  g: 2
  standardise: true
  # Block shuffles per test, the lab's binding cost: ~12 x k x 84 s a cycle,
  # ~28 h at 100. The generalized stepdown's power is nearly flat in k
  # (task 41: 0.28 at 50, 0.32 at 100, 0.35 at 1000, IC 0.70). A verdict
  # drawn on fewer shuffles than this fails the veto.
  min_shuffles: 100
  # decisions/0045 (owner, 2026-10-01, OWNER-QUEUE L20): a stepdown run over
  # fewer than `small_search_below` statistics runs at g = `small_search_g`
  # (ordinary FWER). With g = 2 a set smaller than g has a critical value of
  # -inf, so a single test would pass unconditionally. m is the verdict's
  # n_tests, the number of statistics the stepdown actually ran over.
  small_search_below: 8
  small_search_g: 1
  level: family_then_within
direction:
  strict: true                   # realised sign must match the pre-registered direction

evaluation:
  # Data-integrity vetoes run first: a lookahead or frequency breach makes every
  # downstream number meaningless, so it should be the reason logged, not a
  # turnover breach that happens to be listed earlier. See decisions/proposed/0005.
  # decisions/0005: SUBSTRATE section 10's table order is authoritative.
  # Every verdict is still recorded, so a data-integrity breach remains visible
  # in the store even when a constraint breach is named as cause of death.
  order:
    - cash
    - risk_calibration
    - positions
    - coverage
    - lookahead
    - frequency
    - seed_stability
    - multiple_testing
    - direction
  # A veto that cannot be evaluated because its input is absent FAILS.
  # Fail-open would let an unmeasured run onto the leaderboard.
  on_missing_input: fail
