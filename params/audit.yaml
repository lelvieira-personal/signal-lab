# The ruler audit. decisions/0023. Owner-only.
#
# Phase 2.5: what the weekly ETF layer can deliver at the section 4 budget,
# measured before any hypothesis is generated. A computation on returns, the
# covariance, the constraint set and the cost model; it contains no hypothesis,
# consumes no trial and carries no multiple-testing charge.
params_version: "0.6.0"

# The bar. Net information ratio versus the 50/50 benchmark over the development
# window, after the section 8 cost model, at the section 4 tracking-error budget.
# Owner, 2026-09-11: "0.3 net IR is a good target."
target_net_ir: 0.30

# The simulated-IC ladder. A signal is the cross-sectionally standardised
# forward active return over `horizon_weeks`, blended with noise of matching
# persistence so its information coefficient is the grid value and its speed is
# the horizon. Alpha follows Grinold: IC x sigma x score, per period.
ic_grid: [0.02, 0.05, 0.10, 0.20]
horizon_weeks: [4, 13, 26, 52]
seeds: 3
# The IC = 1 oracle is a ceiling, reported as such; it is not the ruler.
include_oracle: true

# Costs, net first. Half-spread stress on the section 8 placeholders; the
# fee-and-tracking drag is not stressed. Reported net IR is always at 1.0.
cost_multipliers: [1.0, 2.0, 3.0]

# The turnover-shortfall curve: ANNUAL traded-notional caps handed to the solver
# as a hard wall, to measure what a wall costs. decisions/0024 chose to run no
# wall in production, so these cells are now a counterfactual -- what the lab
# gave up by pricing turnover instead of capping it. null is no wall, which is
# what the base cells run. The backstop veto sits at 4.00, well above all three.
turnover_caps: [1.50, 1.00, 0.50]

# The PER-SESSION cap: traded notional allowed in one rebalance. The owner's
# first requirement (2026-09-11) is that no single session consumes the budget,
# and no value has been chosen, so the audit sweeps candidates and reports what
# each costs. 0.10 is roughly 3.5 weeks of a 150%/yr average, 0.25 is 8.7 weeks,
# 0.50 is 17 weeks; null is no per-session limit at all.
# Picking the production number is an owner decision, still open after 0024.
per_rebalance_caps: [0.10, 0.25, 0.50, null]
# What the base, oracle, cost and turnover cells use. null until the owner
# chooses, so the base ladder measures the layer rather than a candidate cap.
per_rebalance_cap_default: null

# The stress grids run at this horizon only; the base grid runs every horizon.
stress_horizon_weeks: 13

covariance:
  estimator: ledoit_wolf         # closed-form shrinkage toward CONSTANT CORRELATION (2003)
  window_periods: 156            # trailing 3 years of weekly returns
  # A series without a full window at a date is unholdable at that date.

# One rebalance day for the audit. Alternates are averaged in phase 3 (section 4
# and section 9); the audit is a ruler, not a run, and one day is the ruler.
rebalance_day: FRI

# Solver: "auto" prefers cvxpy with the chain in constraints.yaml and falls back
# to the scipy reference implementation, which is slow and exists so the two
# can be tested against each other.
solver: auto

output_dir: results/audit
