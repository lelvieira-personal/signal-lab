# Portfolio constraints. SUBSTRATE.md section 4.
# Owner-only. Agents may not edit this file (SUBSTRATE section 2).
params_version: "0.11.1"

direction: long_only
leverage_allowed: false

cash:
  min_weight: 0.00
  max_weight: 0.20            # 0-20% of NAV

positions:
  max_nonzero: 30

turnover:
  # decisions/0017: turnover is TRADED NOTIONAL, sum |dw| -- buys plus sells.
  # The cost formula and the disclosure both read this same figure.
  definition: traded_notional
  #
  # decisions/0024: THERE IS NO ANNUAL WALL. The annual figure is priced, never
  # capped. A wall is free to trade right up to the limit and then forbids
  # trading entirely, which is the failure the owner named: over-trading in
  # quiet windows leaves nothing for the window that matters. A cost that rises
  # without bound restrains the quiet week and can always be paid by the week
  # carrying real alpha.
  #
  # decisions/0038: there is no turnover veto either, and no per-rebalance
  # cap. Turnover is DISCLOSED on every run and highlighted above 200%
  # (reporting only, below).
  target_annualised: 1.00     # reported, and the level the curve is sized around
  # decisions/0038 and its 2026-09-29 addendum (L17): a REPORTING threshold,
  # never a veto. A cell is highlighted when its annual traded notional or its
  # rolling one-year p95 exceeds it. The rolling max is reported, not highlighted.
  highlight_annualised: 2.00
  highlight_windows: [annual, rolling_1y_p95]
  shadow_start_annualised: 0.75   # the cost begins HERE, below the target
  shadow_reference_annualised: 1.50   # slope anchor: `coefficient` bps at this level
  penalty:
    # decisions/0018, re-anchored by decisions/0024, priced by decisions/0040.
    # A one-sided cost on trailing one-year turnover, so the optimiser can buy
    # lower turnover with a little expected alpha.
    #
    # It shapes the weights. It does NOT enter the reported net IR, which is
    # computed from actual costs only -- otherwise a heavily penalised run looks
    # worse for a reason that is not performance and the leaderboard stops being
    # comparable across runs.
    shape: one_sided_above_start
    form: created_marginal      # decisions/0040; `linear` (0018/0024) stays in code for old runs
    #   The marginal rate at trailing annual turnover T is
    #     shadow(T) = coefficient * max(0, T - start) / (reference - start)
    #   and each trade is charged the curve at the turnover IT CREATES
    #   (decisions/0040, "The ruling, made precise"):
    #   1. W = round(periods_per_year). P is traded notional over the previous
    #      W-1 rebalances, x this rebalance's, T(x) = (P + x) * ppy / W. The
    #      shadow for a trade of size x is the integral of the curve along it,
    #        S(x) = k / (2 (r - s)) * [max(0, T(x) - s)^2 - max(0, T(0) - s)^2] * W / ppy
    #      with k = coefficient * 1e-4, s = start, r = reference. S'(x) =
    #      shadow(T(x)): the marginal unit pays the curve at the post-trade
    #      level. S depends only on cumulative traded notional in the window,
    #      so within a fixed window a lump and the same trading split cost the
    #      same; splitting is cheaper only by the trades that roll out of the
    #      window in between (decisions/0040 addendum, 2026-10-01). The shadow
    #      prices the annual total, not lumpiness.
    #   2. Before a full window exists, each missing rebalance counts at
    #      target_annualised / ppy, so the window is always W long.
    units: bps_per_unit_traded
    coefficient: 40.0         # owner, 2026-09-29 (decisions/0040, L18); bps at the reference level
    # Marginal rate, for the reader, at start 0.75 / reference 1.50 / coefficient 40:
    #
    #   trailing annual turnover   0.75   1.00   1.50   2.00   3.00   4.00
    #   marginal shadow (bps)      0.0    13.3   40.0   66.7   120.0  173.3
    #
    # against 15bp of real mid-bucket spread on that same trading. The curve
    # starts below the 100% target on purpose (decisions/0024): a cost that
    # switches on exactly at the target leaves a kink the optimiser can sit in.

tracking_error:
  # decisions/0044 (owner, 2026-10-01, OWNER-QUEUE L19): `max_trailing_3y` is
  # the EX-ANTE SIZING TARGET sigma the solver enforces at every rebalance --
  # the figure decisions/0025 derives from the drawdown tolerance. It is not a
  # ceiling on realised TE: realised trailing-3y TE (and its p95) is a
  # disclosed characteristic (decisions/0030), never a gate. The key keeps its
  # name because code reads it.
  max_trailing_3y: 0.060
  window_years: 3
  penalty:
    # SUBSTRATE section 4: "TE is cheap when conviction dispersion is high and
    # expensive when it is not." So the coefficient is a FUNCTION of conviction,
    # not a number (decisions/0019):
    #
    #     lambda(c) = coefficient_low_conviction
    #                 - (coefficient_low_conviction - coefficient_high_conviction) * c
    #
    # with c in [0, 1]. At c = 0 the model knows nothing and TE is dear; at
    # c = 1 it is certain and TE is cheap. Bounded at BOTH ends on purpose: an
    # overconfident regime estimate must not be able to buy unlimited tracking
    # error, so the coefficient floors at coefficient_high_conviction rather
    # than reaching zero.
    shape: asymmetric_conviction_scaled
    conviction_measure: entropy       # see harness/conviction.py; alt: max_probability
    # SUPERSEDED by decisions/0025. The budget is no longer a penalty scaled by
    # two hand-set coefficients; it is DERIVED from the drawdown tolerance below,
    # and conviction enters through the model's own expected information ratio.
    # These two stay null rather than being deleted because harness/objective.py
    # still reads them; they come out with the solver change.
    coefficient_low_conviction: null  # superseded, decisions/0025
    coefficient_high_conviction: null # superseded, decisions/0025
    owner_to_confirm: []

  budget_from_drawdown:
    # decisions/0025. The tracking-error budget is derived rather than fixed:
    #
    #     budget = tolerance / g(expected IR, signal persistence)
    #
    # where g is the maximum active drawdown per unit of tracking error, from
    # scripts/drawdown_map.py. The scaling law E[max drawdown] = sigma *
    # g(IR, horizon) is exact, so the inversion is one division.
    #
    # Conviction scaling falls out instead of being asserted: higher conviction
    # means higher expected IR, which means the same drawdown tolerance affords
    # more tracking error. The bound decisions/0019 wanted comes from the
    # geometry -- relaxing the budget raises expected active return less than
    # proportionally under long-only and the caps, so ex-ante IR falls as the
    # budget rises and the fixed point is a contraction.
    enabled: false            # the solver does not read this yet; see 0025
    tolerance: 0.320          # p95 maximum active drawdown over the horizon
    statistic: p95            # owner, 2026-09-16: a median tolerance is a coin flip
    index_by_persistence: true  # a slow signal earns a tighter budget, 0025
    horizon_years: 19         # the development window, as decisions/0003 used
    may_exceed_mandate: true  # section 4's episodic excursions; the p95 TE veto governs
    # Calibration, and it is not a loosening: 0.320 is the value that puts the
    # budget at exactly 6.00% at the lab's own IR 0.30 target. decisions/0003's
    # 18% was a MEDIAN statement ("roughly the worse half of paths fail at IR
    # 0.3"); read at p95 it would have meant 2.74%, less than half today's risk.
    # 32% is what the current 6% mandate has always implied and never stated.

rebalance:
  frequency: weekly
  day: FRI
  # Section 4 and section 9: alternates are averaged over, never selected.
  alternates: [TUE, WED, FRI]
  alternates_are_averaged: true

benchmark:
  equity: NDUEACWF            # MSCI ACWI net TR
  bond: LEGATRUU              # Bloomberg Global Aggregate, unhedged USD
  weights: [0.50, 0.50]
  currency: USD
  bond_leg_hedged: false
  rebalanced_with_strategy: true
  pre_1999_extension:
    equity: MXWO              # developed only, gross dividends
    bond: SBWGU               # sovereign only, no credit
    splice_date: "1999-01-01"
    results_depending_on_it_must_say_so: true
  alternative_bond_leg: LEGATRUH   # section 5.5, owner to confirm for production
  owner_to_confirm: [bond_leg_hedged]

fx:
  benchmark_unhedged: true
  # Section 4: hedged series are the counterfactual, not a separate live axis in v0.3.
  hedged_series_are_live_axis: false

views:
  # decisions/0059 (B), ruled 2026-10-12 and 2026-10-14; the burn-in amended to
  # 52 weeks, lab-wide, on 2026-10-16 (0059 addendum). How a hypothesis's score
  # becomes a view in return units, for every hypothesis alike:
  #
  #     v_k(t) = ic_prior * sigma_k(t) * z_k(t) / sqrt(h)
  #
  # ic_prior is a prior, not a measurement, and is never fitted from a run.
  ic_prior: 0.05
  # h is the geometric mean of the hypothesis's horizon_weeks range, rounded to
  # the nearest week: 4-13 gives 7, 8-26 gives 14, 13-52 gives 26.
  horizon_rule: geometric_mean_rounded
  standardisation:
    # z is built in one place: an expanding-window mean and standard deviation
    # of the knowledge-dated scores, winsorised, after a burn-in of score
    # history. Before the burn-in is met the view is zero.
    window: expanding
    burn_in_weeks: 52
    winsorise_at: 3.0

solver:
  # cvxpy with an open-source solver by default.
  default: CLARABEL
  fallbacks: [OSQP, ECOS]
  mosek_enabled: false        # commercial; enable only with the `mosek` extra installed
