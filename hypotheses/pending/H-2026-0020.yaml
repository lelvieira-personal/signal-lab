id: H-2026-0020
family: volatility_stress
signal: implied_tail_ratio_10d_3m_hyg
direction: positive
target_axis: credit
rationale: >
  The same claim as H-2026-0018 applied to US high yield. Puts on a high-yield
  bond fund price a credit sell-off and calls a rally; when the options price
  relatively more upside than downside, the claim is that spreads are more
  likely to tighten than widen over the coming quarter. The relationship is
  positive: a higher tail ratio implies more high-yield credit. The horizon is
  the option tenor, three months. It is directional within high yield, scoped to
  the HY-rated instruments, and needs no short because the benchmark holds
  credit throughout. The declared weaknesses: the insurance reading of the
  ratio predicts the opposite sign; high-yield fund options are thinner than
  equity index options, so the 10-delta points may be more model than market;
  and the fund's options also price its equity-like beta, so the signal may
  overlap with H-2026-0018's US leg.
horizon_weeks: 4-13
