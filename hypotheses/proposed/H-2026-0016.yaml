id: H-2026-0016
kind: measurement
family: exposure_estimation
signal: kalman_dlm_discount_tvp
direction: positive
target_axis: loadings
rationale: >
  A loading can drift without any discrete break: an index's composition
  changes, a market deepens, a hedge ratio migrates. A rolling window treats a
  three-year-old week and last week alike and then drops the old one all at
  once. A dynamic linear model with random-walk coefficients updates the loading
  every week and forgets smoothly, and it carries the uncertainty of each
  loading forward as part of the filter, widening it when the data disagree
  with the prediction. The claim is positive: filtered loadings predict
  next-week returns with a lower robust loss than rolling OLS. The discount
  factor, which sets how fast the model forgets, is chosen each week from a
  fixed grid by one-step predictive likelihood on past data only, so it is
  never tuned on the weeks it is scored on. The risk is that a fast-forgetting
  filter chases noise and a slow one is just a long window.
horizon_weeks: 1
expected_expression: both
proposed_by: owner
provenance: adaptation
reference: null
