id: H-2026-0014
kind: measurement
family: exposure_estimation
signal: theil_goldberger_peer_prior_156w
direction: positive
target_axis: loadings
rationale: >
  A loading estimated on three years of weekly data for one index is noisy, and
  noisiest exactly where the factors are collinear, as equity and credit are.
  Indices in the same reporting class share most of their economics, so the
  class's average loading is real prior information about any one of them.
  Theil-Goldberger mixed estimation combines the sample with that prior as a
  stochastic restriction, weighting each by its precision, which pulls a noisy
  loading toward its peers by more when the sample says less. The claim is
  positive: the shrunk loadings predict next-week returns with a lower robust
  loss than rolling OLS. It also yields a posterior covariance, so the
  uncertainty check is a direct test of whether that covariance is honest. The
  risk is a wrong prior: an index that truly differs from its class, such as a
  sector with unusual rate sensitivity, is pulled the wrong way.
horizon_weeks: 1
expected_expression: both
proposed_by: owner
provenance: adaptation
reference: null
