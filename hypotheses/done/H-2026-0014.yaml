  - BCOMTR
notes: >
  Registered 2026-10-01 (HANDOFF task 45). Judged on
  out-of-sample loading fidelity against the rolling-OLS incumbent, never on
  net IR (decisions/0016, decisions/0046). The configuration is fixed in
  decisions/0046 section 4 and is not to be tuned. The inputs are the factor
  series only; the instruments scored are the investable backbone and second
  tiers. Drafted by Cowork from the owner's stated concerns of 2026-10-01.
